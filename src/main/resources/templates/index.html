<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Угадай число</title>
</head>
<body>

<h1>Угадай число </h1>

<h2>Правила игры</h2>
<p>Я загадываю число от 0 до 100.</p>
<p>Твоя задача — угадать его!</p>
<p>После каждой попытки я буду подсказывать — больше или меньше.</p>
<p>Количество попыток не ограничено.</p>

<p>Сыграно игр в этом сеансе: <span th:text="${gamesCount}"></span></p>

<a href="/start">Начать игру</a>

</body>
</html>
